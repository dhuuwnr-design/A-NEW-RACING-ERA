plugins { id 'com.android.application' }

android {
    namespace 'com.apexenginenext'
    compileSdk 35

    defaultConfig {
        applicationId 'com.apexenginenext'
        minSdk 26
        targetSdk 35
        versionCode 2
        versionName '0.2.0'
        externalNativeBuild { cmake { cppFlags '-std=c++17' } }
    }

    externalNativeBuild {
        cmake { path file('src/main/cpp/CMakeLists.txt') }
    }
}
